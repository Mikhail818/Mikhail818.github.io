<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Mikhail Lyskov engineering portfolio preview</title>
  <desc id="desc">Social preview card for the Mikhail Lyskov engineering portfolio.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7f3ed"/>
      <stop offset="100%" stop-color="#f1ece5"/>
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#182230"/>
      <stop offset="100%" stop-color="#101821"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6d95bc"/>
      <stop offset="100%" stop-color="#2f5f8d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="26" flood-color="#121a26" flood-opacity="0.1"/>
    </filter>
    <clipPath id="portraitClip">
      <rect x="822" y="124" width="238" height="300" rx="28"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <g opacity="0.05" stroke="#121a26">
    <path d="M0 118H1200M0 258H1200M0 398H1200M0 538H1200"/>
    <path d="M118 0V630M318 0V630M518 0V630M718 0V630M918 0V630M1118 0V630"/>
  </g>

  <rect x="72" y="72" width="1056" height="486" rx="34" fill="#ffffff" fill-opacity="0.42" stroke="#121a26" stroke-opacity="0.06"/>

  <g filter="url(#shadow)">
    <rect x="86" y="86" width="662" height="458" rx="30" fill="#faf7f2" stroke="#121a26" stroke-opacity="0.08"/>
    <rect x="764" y="86" width="350" height="458" rx="30" fill="url(#panel)"/>
  </g>

  <rect x="126" y="126" width="244" height="40" rx="20" fill="#ffffff" stroke="#121a26" stroke-opacity="0.08"/>
  <text x="153" y="151" fill="#2f5f8d" font-family="IBM Plex Mono, monospace" font-size="16" letter-spacing="3">ENGINEERING PORTFOLIO</text>

  <text x="126" y="246" fill="#121a26" font-family="Manrope, Arial, sans-serif" font-size="82" font-weight="700" letter-spacing="-1.2">Mikhail Lyskov</text>

  <text x="126" y="332" fill="#516173" font-family="Manrope, Arial, sans-serif" font-size="34">
    <tspan x="126" dy="0">Engineering systems</tspan>
    <tspan x="126" dy="42">for operational clarity.</tspan>
  </text>

  <rect x="126" y="408" width="394" height="44" rx="22" fill="#ffffff" stroke="#121a26" stroke-opacity="0.08"/>
  <text x="152" y="436" fill="#121a26" font-family="Manrope, Arial, sans-serif" font-size="20" font-weight="600">Manufacturing • Automation • Reliability</text>

  <rect x="126" y="486" width="300" height="36" rx="18" fill="#eef3f8"/>
  <text x="151" y="509" fill="#2f5f8d" font-family="IBM Plex Mono, monospace" font-size="15" letter-spacing="2.2">github.com/Mikhail818</text>

  <rect x="822" y="124" width="238" height="300" rx="28" fill="#0f1721" stroke="#f5f1ea" stroke-opacity="0.12" stroke-width="2"/>
  <image href="profile.png" x="822" y="124" width="238" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#portraitClip)"/>

  <path d="M822 456H1060" stroke="url(#accent)" stroke-width="6" stroke-linecap="round"/>
  <text x="822" y="498" fill="#f5f1ea" font-family="IBM Plex Mono, monospace" font-size="17" letter-spacing="2.8">UNIVERSITY OF SHEFFIELD</text>
  <text x="822" y="530" fill="#f5f1ea" fill-opacity="0.72" font-family="Manrope, Arial, sans-serif" font-size="22">General Engineering • Year in Industry</text>
</svg>
